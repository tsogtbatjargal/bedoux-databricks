bundle:
  name: bedoux_databricks

include:
  - resources/*.yml

variables:
  bedoux_lead_invalid_rate:
    description: "Synthetic Track 2 lead invalid rate (0..1); deploy-time demo setting, restore to 0.02"
    default: "0.02"
  catalog:
    description: Unity Catalog catalog used by all three layers
    default: workspace
  aglc_enforce_governance:
    description: "Track 3: declare UC column masks and the domain row filter in DLT tables (true/false)"
    default: "true"
  aglc_apply_grants:
    description: "Track 3: apply grants to aglc_* groups; groups must exist (true/false)"
    default: "false"
  aglc_inject_discrepancy:
    description: "Track 3 demo: none | revenue | missing_row; restore to none"
    default: "none"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-3f70aae3-11d5.cloud.databricks.com
    run_as:
      user_name: tsoglog.uli@gmail.com

  # Track 4: Azure Databricks workspace adb-adp-dev (rg-adp-dev, canadacentral;
  # docs/adp/azure-setup.md). Deploys the same bundle; every job and pipeline is
  # serverless and manual-trigger. Locally pass --profile; CI authenticates with
  # GitHub OIDC (.github/workflows/deploy-azure.yml). No profile is named here so
  # CI does not depend on a local ~/.databrickscfg entry.
  azure_dev:
    mode: development
    workspace:
      host: https://adb-7405615454810108.8.azuredatabricks.net
    variables:
      # The workspace catalog Azure created with the workspace. The metastore
      # has no root storage, so a new catalog would need its own managed location.
      catalog: adb_adp_dev
