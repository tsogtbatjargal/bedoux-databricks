<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-labelledby="bdx-title bdx-desc">
  <title id="bdx-title">bedoux-databricks architecture (system context)</title>
  <desc id="bdx-desc">Two medallion pipeline tracks (TPC-H and Bedoux), each Bronze to Silver to Gold, governed by Unity Catalog, feeding a shared SQL Warehouse and two Genie AI/BI spaces, driven by a GitHub Actions CI/CD pipeline into a Databricks Asset Bundle.</desc>

  <defs>
    <marker id="bdx-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="bdx-arrow-cicd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <style>
      .bdx-box { stroke-width: 1.5; rx: 8; }
      .bdx-box-fill { fill: #161b22; }
      .bdx-label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; text-anchor: middle; }
      .bdx-label-sm { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
      .bdx-title-text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; text-anchor: middle; }
      .bdx-edge { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#bdx-arrow); }
      .bdx-edge-cicd { stroke: #3fb950; stroke-width: 1.5; fill: none; marker-end: url(#bdx-arrow-cicd); stroke-dasharray: 4 3; }
      .bdx-edge-label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9px; fill: #8b949e; text-anchor: middle; }
    </style>
  </defs>

  <!-- Optional dark backdrop: delete this rect if your site already renders a dark background behind embedded SVGs -->
  <rect class="bdx-bg" x="0" y="0" width="1100" height="700" fill="#0d1117"/>

  <text class="bdx-title-text" x="550" y="28" font-size="18" font-weight="600">bedoux-databricks — Architecture (System Context)</text>
  <text class="bdx-label-sm" x="550" y="46" font-size="12">Two medallion tracks · shared governance &amp; BI layer · CI/CD-driven</text>

  <!-- ============ CI/CD ops plane (side panel) ============ -->
  <g id="cicd-panel">
    <title>GitHub Actions CI/CD pipeline</title>
    <rect class="bdx-box" x="20" y="70" width="170" height="330" fill="#161b22" stroke="#3fb950" fill-opacity="0.9" rx="10"/>
    <text class="bdx-label" x="105" y="92" font-size="12" font-weight="600" fill="#3fb950">GitHub Actions</text>
    <text class="bdx-label-sm" x="105" y="106" font-size="10">CI/CD</text>

    <rect class="bdx-box bdx-box-fill" x="40" y="125" width="130" height="40" stroke="#30363d"/>
    <text class="bdx-label" x="105" y="141" font-size="11">test</text>
    <text class="bdx-label-sm" x="105" y="154" font-size="9">pytest tests/</text>

    <path class="bdx-edge-cicd" id="edge-cicd-test-validate" d="M105,165 L105,185"/>

    <rect class="bdx-box bdx-box-fill" x="40" y="185" width="130" height="40" stroke="#30363d"/>
    <text class="bdx-label" x="105" y="201" font-size="11">validate</text>
    <text class="bdx-label-sm" x="105" y="214" font-size="9">bundle validate · on PR</text>

    <path class="bdx-edge-cicd" id="edge-cicd-validate-deploy" d="M105,225 L105,245"/>

    <rect class="bdx-box bdx-box-fill" x="40" y="245" width="130" height="40" stroke="#30363d"/>
    <text class="bdx-label" x="105" y="261" font-size="11">deploy</text>
    <text class="bdx-label-sm" x="105" y="274" font-size="9">bundle deploy · on merge to main</text>

    <path class="bdx-edge-cicd" id="edge-cicd-deploy-dispatch" d="M105,285 L105,300" stroke-dasharray="2 3"/>

    <rect class="bdx-box" x="40" y="300" width="130" height="40" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
    <text class="bdx-label" x="105" y="316" font-size="11">workflow_dispatch</text>
    <text class="bdx-label-sm" x="105" y="329" font-size="9">manual job trigger</text>
  </g>

  <!-- Hub: Databricks Asset Bundle -->
  <circle id="bundle-hub" cx="200" cy="265" r="5" fill="#3fb950"/>
  <text class="bdx-label-sm" x="212" y="269" font-size="10" text-anchor="start" fill="#3fb950">Databricks Asset Bundle</text>

  <path class="bdx-edge-cicd" id="edge-cicd-deploy-bundle-tpch" d="M200,265 L215,265 L215,75 L390,75 L390,110"/>
  <path class="bdx-edge-cicd" id="edge-cicd-deploy-bundle-bedoux" d="M200,265 L226,265 L226,58 L800,58 L800,110"/>

  <!-- ============ Unity Catalog backdrop ============ -->
  <g id="unity-catalog">
    <title>Unity Catalog — governance layer, catalog: workspace</title>
    <rect x="210" y="95" width="780" height="330" rx="14" fill="#a371f7" fill-opacity="0.06" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="bdx-label-sm" x="600" y="413" font-size="11" fill="#a371f7">Unity Catalog — governance layer · catalog: workspace</text>
  </g>

  <!-- ============ Track 1: TPC-H ============ -->
  <g id="track-tpch">
    <text class="bdx-label" x="390" y="108" font-size="0"/>
    <!-- Bronze -->
    <g>
      <title>bronze_pipeline — reads samples.tpch (8 tables) into workspace.bronze</title>
      <rect class="bdx-box bdx-box-fill" x="230" y="110" width="320" height="55" stroke="#58a6ff"/>
      <text class="bdx-label" x="390" y="130" font-size="12" font-weight="600" fill="#58a6ff">bronze_pipeline</text>
      <text class="bdx-label-sm" x="390" y="145" font-size="9">workspace.bronze</text>
      <text class="bdx-label-sm" x="390" y="157" font-size="9">samples.tpch (8 tables)</text>
    </g>

    <path class="bdx-edge" id="edge-tpch-bronze-silver" d="M390,165 L390,200"/>
    <text class="bdx-edge-label" x="270" y="177">Auto CDC (SCD1):</text>
    <text class="bdx-edge-label" x="270" y="188">customer, orders</text>
    <text class="bdx-edge-label" x="270" y="199">DQ expectations: other 6</text>

    <!-- Silver -->
    <g>
      <title>silver_pipeline — Auto CDC on customer/orders, DLT expectations on the rest, into workspace.silver</title>
      <rect class="bdx-box bdx-box-fill" x="230" y="200" width="320" height="65" stroke="#58a6ff"/>
      <text class="bdx-label" x="390" y="222" font-size="12" font-weight="600" fill="#58a6ff">silver_pipeline</text>
      <text class="bdx-label-sm" x="390" y="237" font-size="9">workspace.silver</text>
      <text class="bdx-label-sm" x="390" y="251" font-size="9" fill="#d29922">⚠ DLT expectations gate active</text>
    </g>

    <path class="bdx-edge" id="edge-tpch-silver-gold" d="M390,265 L390,300"/>

    <!-- Gold -->
    <g>
      <title>gold_pipeline — 3 business-ready tables in workspace.gold</title>
      <rect class="bdx-box bdx-box-fill" x="230" y="300" width="320" height="55" stroke="#58a6ff"/>
      <text class="bdx-label" x="390" y="320" font-size="12" font-weight="600" fill="#58a6ff">gold_pipeline</text>
      <text class="bdx-label-sm" x="390" y="335" font-size="9">workspace.gold (3 tables)</text>
      <text class="bdx-label-sm" x="390" y="347" font-size="9">revenue · CLV · top products</text>
    </g>
  </g>

  <!-- ============ Track 2: Bedoux ============ -->
  <g id="track-bedoux">
    <!-- Bronze -->
    <g>
      <title>bedoux_bronze_pipeline — seeded synthetic generator (5 entities) into workspace.bedoux_bronze</title>
      <rect class="bdx-box bdx-box-fill" x="640" y="110" width="320" height="55" stroke="#f0883e"/>
      <text class="bdx-label" x="800" y="130" font-size="12" font-weight="600" fill="#f0883e">bedoux_bronze_pipeline</text>
      <text class="bdx-label-sm" x="800" y="145" font-size="9">workspace.bedoux_bronze</text>
      <text class="bdx-label-sm" x="800" y="157" font-size="9">synthetic generator (5 entities)</text>
    </g>

    <path class="bdx-edge" id="edge-bedoux-bronze-silver" d="M800,165 L800,200"/>
    <text class="bdx-edge-label" x="920" y="177">No CDC — full</text>
    <text class="bdx-edge-label" x="920" y="188">recompute each run</text>
    <text class="bdx-edge-label" x="920" y="199">(deliberate choice)</text>

    <!-- Silver -->
    <g>
      <title>bedoux_silver_pipeline — DLT expectations drop ~2% deliberately-invalid synthetic rows, into workspace.bedoux_silver</title>
      <rect class="bdx-box bdx-box-fill" x="640" y="200" width="320" height="65" stroke="#f0883e"/>
      <text class="bdx-label" x="800" y="222" font-size="12" font-weight="600" fill="#f0883e">bedoux_silver_pipeline</text>
      <text class="bdx-label-sm" x="800" y="237" font-size="9">workspace.bedoux_silver</text>
      <text class="bdx-label-sm" x="800" y="251" font-size="9" fill="#d29922">⚠ DLT expectations: ~2% invalid rows dropped</text>
    </g>

    <path class="bdx-edge" id="edge-bedoux-silver-gold" d="M800,265 L800,300"/>

    <!-- Gold -->
    <g>
      <title>bedoux_gold_pipeline — 3 business-ready tables in workspace.bedoux_gold</title>
      <rect class="bdx-box bdx-box-fill" x="640" y="300" width="320" height="55" stroke="#f0883e"/>
      <text class="bdx-label" x="800" y="320" font-size="12" font-weight="600" fill="#f0883e">bedoux_gold_pipeline</text>
      <text class="bdx-label-sm" x="800" y="335" font-size="9">workspace.bedoux_gold (3 tables)</text>
      <text class="bdx-label-sm" x="800" y="347" font-size="9">campaign perf · funnel · ops health</text>
    </g>
  </g>

  <!-- ============ SQL Warehouse ============ -->
  <path class="bdx-edge" id="edge-tpch-gold-warehouse" d="M390,355 L390,435 L560,435 L560,445"/>
  <path class="bdx-edge" id="edge-bedoux-gold-warehouse" d="M800,355 L800,435 L640,435 L640,445"/>

  <g id="sql-warehouse">
    <title>Shared SQL Warehouse — 2X-Small, the one warehouse Databricks Free Edition allows</title>
    <rect class="bdx-box bdx-box-fill" x="515" y="445" width="170" height="50" stroke="#d29922"/>
    <text class="bdx-label" x="600" y="465" font-size="12" font-weight="600" fill="#d29922">SQL Warehouse</text>
    <text class="bdx-label-sm" x="600" y="479" font-size="9">2X-Small · shared (Free Edition limit)</text>
  </g>

  <!-- ============ Genie / AI-BI spaces ============ -->
  <path class="bdx-edge" id="edge-warehouse-genie-tpch" d="M600,495 L600,520 L390,520 L390,545"/>
  <path class="bdx-edge" id="edge-warehouse-genie-bedoux" d="M600,495 L600,520 L800,520 L800,545"/>

  <g id="genie-tpch">
    <title>Genie space: TPC-H Medallion Analytics, over workspace.gold.*</title>
    <rect class="bdx-box bdx-box-fill" x="230" y="545" width="320" height="55" stroke="#39c5cf"/>
    <text class="bdx-label" x="390" y="566" font-size="12" font-weight="600" fill="#39c5cf">Genie: TPC-H Medallion Analytics</text>
    <text class="bdx-label-sm" x="390" y="581" font-size="9">natural-language queries over workspace.gold.*</text>
    <text class="bdx-label-sm" x="390" y="593" font-size="8">space_id 01f18c57fa251338962ee7a34efab97e</text>
  </g>

  <g id="genie-bedoux">
    <title>Genie space: Bedoux Ops &amp; Marketing Analytics, over workspace.bedoux_gold.*</title>
    <rect class="bdx-box bdx-box-fill" x="640" y="545" width="320" height="55" stroke="#39c5cf"/>
    <text class="bdx-label" x="800" y="566" font-size="12" font-weight="600" fill="#39c5cf">Genie: Bedoux Ops &amp; Marketing</text>
    <text class="bdx-label-sm" x="800" y="581" font-size="9">natural-language queries over workspace.bedoux_gold.*</text>
    <text class="bdx-label-sm" x="800" y="593" font-size="8">space_id 01f18c5765861b98a829e34fcec67160</text>
  </g>

  <!-- ============ Legend ============ -->
  <g id="legend" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10">
    <line x1="40" y1="622" x2="60" y2="622" stroke="#58a6ff" stroke-width="3"/>
    <text class="bdx-label-sm" x="66" y="626" text-anchor="start">Track: TPC-H (classic DE benchmark)</text>

    <line x1="40" y1="640" x2="60" y2="640" stroke="#f0883e" stroke-width="3"/>
    <text class="bdx-label-sm" x="66" y="644" text-anchor="start">Track: Bedoux (original synthetic domain)</text>

    <line x1="330" y1="622" x2="350" y2="622" stroke="#a371f7" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="bdx-label-sm" x="356" y="626" text-anchor="start">Unity Catalog (governance, both tracks)</text>

    <line x1="330" y1="640" x2="350" y2="640" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="bdx-label-sm" x="356" y="644" text-anchor="start">CI/CD ops plane (drives Asset Bundle deploys)</text>

    <text class="bdx-label-sm" x="640" y="626" text-anchor="start" fill="#d29922">⚠ = DLT expectations data-quality gate</text>
    <text class="bdx-label-sm" x="640" y="644" text-anchor="start">Free Edition: 1 warehouse, 1 pipeline/type, no auto-schedule</text>
  </g>
</svg>
