<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" width="900" height="800" role="img" aria-labelledby="bdx-title bdx-desc">
  <title id="bdx-title">bedoux-databricks — Bedoux architecture (system context)</title>
  <desc id="bdx-desc">The Bedoux analytics job runs Bronze to Silver to a publication gate to Gold. GitHub Actions deploys the Databricks Asset Bundle; Unity Catalog governs the datasets; a SQL Warehouse serves Genie AI/BI. Silver deduplicates and quarantines invalid fact rows with reasons. The notebook gate requires fresh, complete evidence, positive input counts, row conservation and a quarantine rate at or below 10% for every required source. As a sub-step, the gate also redacts sensitive fields, checks for a canary marker, and appends a row to an append-only evidence log, bedoux_silver.gate_evidence_log, each time the gate task executes (at least one per run; a retried run writes duplicates) — a durable Delta write, not a call to any outbound model; no such call site exists yet in this project. Failure skips Gold and preserves previously published content. Direct Gold runs bypass the job-level gate. Runtime investigation, Jev routing and recovery with approval remain planned.</desc>

  <defs>
    <marker id="bdx-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <marker id="bdx-arrow-cicd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/>
    </marker>
    <style>
      .bdx-box { stroke-width: 1.5; rx: 8; }
      .bdx-box-fill { fill: #161b22; }
      .bdx-label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; text-anchor: middle; }
      .bdx-label-sm { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; text-anchor: middle; }
      .bdx-label-sm[text-anchor="start"] { text-anchor: start; }
      .bdx-title-text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #e6edf3; text-anchor: middle; }
      .bdx-edge { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#bdx-arrow); }
      .bdx-edge-cicd { stroke: #3fb950; stroke-width: 1.5; fill: none; marker-end: url(#bdx-arrow-cicd); stroke-dasharray: 4 3; }
      .bdx-edge-label { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9px; fill: #8b949e; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bdx-bg" width="900" height="800" fill="#0d1117"/>
  <text class="bdx-title-text" x="450" y="28" font-size="18" font-weight="600">bedoux-databricks — Bedoux Architecture</text>
  <text class="bdx-label-sm" x="450" y="46" font-size="12">Medallion pipeline · governance &amp; BI layer · CI/CD-driven</text>

  <!-- CI/CD operations plane, retained from the detailed system context. -->
  <g id="cicd-panel">
    <title>GitHub Actions CI/CD pipeline</title>
    <rect class="bdx-box" x="20" y="70" width="170" height="330" fill="#161b22" stroke="#3fb950" fill-opacity="0.9" rx="10"/>
    <text class="bdx-label" x="105" y="92" font-size="12" font-weight="600">GitHub Actions</text>
    <text class="bdx-label-sm" x="105" y="106" font-size="10">CI/CD</text>
    <rect class="bdx-box bdx-box-fill" x="40" y="125" width="130" height="40" stroke="#30363d"/>
    <text class="bdx-label" x="105" y="141" font-size="11">test</text>
    <text class="bdx-label-sm" x="105" y="154" font-size="9">pytest tests/</text>
    <path class="bdx-edge-cicd" id="edge-cicd-test-validate" d="M105,165 L105,185"/>
    <rect class="bdx-box bdx-box-fill" x="40" y="185" width="130" height="40" stroke="#30363d"/>
    <text class="bdx-label" x="105" y="201" font-size="11">validate</text>
    <text class="bdx-label-sm" x="105" y="214" font-size="9">bundle changes · PR / main</text>
    <path class="bdx-edge-cicd" id="edge-cicd-validate-deploy" d="M105,225 L105,245"/>
    <rect class="bdx-box bdx-box-fill" x="40" y="245" width="130" height="40" stroke="#30363d"/>
    <text class="bdx-label" x="105" y="261" font-size="11">deploy</text>
    <text class="bdx-label-sm" x="105" y="274" font-size="9">bundle changes · main</text>
    <path class="bdx-edge-cicd" id="edge-cicd-deploy-dispatch" d="M105,285 L105,300" stroke-dasharray="2 3"/>
    <rect class="bdx-box" x="40" y="300" width="130" height="40" fill="#161b22" stroke="#30363d" stroke-dasharray="4 3"/>
    <text class="bdx-label" x="105" y="316" font-size="11">workflow_dispatch</text>
    <text class="bdx-label-sm" x="105" y="329" font-size="9">manual job trigger</text>
    <text class="bdx-label-sm" x="105" y="370" font-size="10">Databricks Asset Bundle</text>
  </g>
  <circle id="bundle-hub" cx="200" cy="265" r="5" fill="#3fb950"/>
  <path class="bdx-edge-cicd" id="edge-cicd-deploy-bundle-bedoux" d="M200,265 L226,265 L226,58 L565,58 L565,110"/>

  <!-- Unity Catalog and the Bedoux track. -->
  <g id="unity-catalog">
    <title>Unity Catalog — governance layer, catalog: workspace</title>
    <rect x="250" y="95" width="610" height="430" rx="14" fill="#a371f7" fill-opacity="0.06" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text class="bdx-label-sm" x="555" y="513" font-size="11">Unity Catalog — governance layer · catalog: workspace</text>
  </g>

  <g id="track-bedoux">
    <g id="bedoux-bronze">
      <title>bedoux_bronze_pipeline — seeded synthetic generator (5 entities) into workspace.bedoux_bronze</title>
      <rect class="bdx-box bdx-box-fill" x="350" y="110" width="430" height="55" stroke="#f0883e"/>
      <text class="bdx-label" x="565" y="130" font-size="12" font-weight="600">bedoux_bronze_pipeline</text>
      <text class="bdx-label-sm" x="565" y="145" font-size="9">workspace.bedoux_bronze</text>
      <text class="bdx-label-sm" x="565" y="157" font-size="9">synthetic generator (5 entities)</text>
    </g>
    <path class="bdx-edge" id="edge-bedoux-bronze-silver" d="M565,165 L565,200"/>
    <text class="bdx-edge-label" x="712" y="178">No CDC — full recompute</text>
    <text class="bdx-edge-label" x="712" y="191">each run (deliberate choice)</text>

    <g id="bedoux-silver">
      <title>bedoux_silver_pipeline — deduplicates leads, web events and ops events; quarantines invalid fact rows with reasons; computes quality metrics and gate_status</title>
      <rect class="bdx-box bdx-box-fill" x="350" y="200" width="430" height="65" stroke="#f0883e"/>
      <text class="bdx-label" x="565" y="222" font-size="12" font-weight="600">bedoux_silver_pipeline</text>
      <text class="bdx-label-sm" x="565" y="237" font-size="9">workspace.bedoux_silver</text>
      <text class="bdx-label-sm" x="565" y="251" font-size="10">dedup · quarantine with reasons · gate_status</text>
    </g>
    <path class="bdx-edge" id="edge-bedoux-silver-gate" d="M565,265 L565,290"/>

    <g id="bedoux-publication-gate">
      <title>bedoux_gate_task — fails closed if a required source lacks a fresh explicit pass, positive input count or conserved rows. Failure prevents the job's Gold refresh. Sub-step: evaluate_evidence_gate + redact_evidence_packet append a row to the append-only bedoux_silver.gate_evidence_log each time the gate task executes (at least one per run; a retried run writes duplicates) — a durable Delta write, not a model call; no outbound model-call site exists yet in this project.</title>
      <rect class="bdx-box" x="350" y="290" width="430" height="95" fill="#2b1d14" stroke="#f0883e"/>
      <text class="bdx-label" x="565" y="308" font-size="13" font-weight="600" style="fill: #ffa657">bedoux_gate_task</text>
      <text class="bdx-label" x="565" y="324" font-size="11">Publication gate · notebook task</text>
      <text class="bdx-label-sm" x="565" y="340" font-size="10">fresh, complete evidence · row conservation</text>
      <text class="bdx-label-sm" x="565" y="354" font-size="10">quarantine rate ≤ 10% for each required source</text>
      <text class="bdx-label-sm" x="565" y="370" font-size="9">sub-step: redact + evaluate → append-only gate_evidence_log</text>
    </g>
    <path class="bdx-edge" id="edge-bedoux-gate-gold" d="M565,385 L565,400"/>
    <text class="bdx-edge-label" x="599" y="393">PASS only</text>

    <g id="bedoux-gold">
      <title>bedoux_gold_pipeline — 3 business-ready tables in workspace.bedoux_gold</title>
      <rect class="bdx-box bdx-box-fill" x="350" y="400" width="430" height="55" stroke="#f0883e"/>
      <text class="bdx-label" x="565" y="420" font-size="12" font-weight="600">bedoux_gold_pipeline</text>
      <text class="bdx-label-sm" x="565" y="435" font-size="9">workspace.bedoux_gold (3 tables)</text>
      <text class="bdx-label-sm" x="565" y="447" font-size="9">campaign perf · funnel · ops health</text>
    </g>
    <text class="bdx-label" x="565" y="475" font-size="10">FAIL: skip refresh; keep previously published Gold</text>
    <text class="bdx-label-sm" x="565" y="491" font-size="10">Job-level control: direct Gold runs bypass this gate</text>
  </g>

  <path class="bdx-edge" id="edge-bedoux-gold-warehouse" d="M780,428 L820,428 L820,535 L565,535 L565,545"/>
  <g id="sql-warehouse">
    <title>Shared SQL Warehouse — 2X-Small in this project's Free Edition workspace</title>
    <rect class="bdx-box bdx-box-fill" x="480" y="545" width="170" height="50" stroke="#d29922"/>
    <text class="bdx-label" x="565" y="565" font-size="12" font-weight="600">SQL Warehouse</text>
    <text class="bdx-label-sm" x="565" y="579" font-size="9">2X-Small · shared</text>
  </g>

  <path class="bdx-edge" id="edge-warehouse-genie-bedoux" d="M565,595 L565,645"/>
  <g id="genie-bedoux">
    <title>Genie space: Bedoux Ops &amp; Marketing Analytics, over workspace.bedoux_gold.*</title>
    <rect class="bdx-box bdx-box-fill" x="350" y="645" width="430" height="55" stroke="#39c5cf"/>
    <text class="bdx-label" x="565" y="666" font-size="12" font-weight="600">Genie: Bedoux Ops &amp; Marketing</text>
    <text class="bdx-label-sm" x="565" y="681" font-size="9">natural-language queries over workspace.bedoux_gold.*</text>
  </g>

  <g id="legend" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10">
    <line x1="40" y1="722" x2="60" y2="722" stroke="#f0883e" stroke-width="3"/>
    <text class="bdx-label-sm" x="66" y="726" text-anchor="start">Bedoux · synthetic data · manual job trigger</text>
    <line x1="40" y1="740" x2="60" y2="740" stroke="#3fb950" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="bdx-label-sm" x="66" y="744" text-anchor="start">CI/CD ops plane · Asset Bundle deploys</text>
    <line x1="450" y1="722" x2="470" y2="722" stroke="#a371f7" stroke-width="2" stroke-dasharray="4 3"/>
    <text class="bdx-label-sm" x="476" y="726" text-anchor="start">Unity Catalog · governance</text>
    <text class="bdx-label-sm" x="476" y="744" text-anchor="start">Bedoux gate: job control before Gold publication</text>
  </g>
  <text class="bdx-label-sm" x="450" y="778" font-size="11">Planned: runtime investigation · Jev routing · recovery with approval</text>
</svg>
