<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Real-model evaluation: gpt-5.4-mini on 30 incident cases</title>
  <desc id="d">Stacked bars for five Azure OpenAI runs of 30 cases each, split into correct labels routed, wrong labels sent to a human and refused citations sent to a human, with summary tiles.</desc>
  <style>
    :root{ --bg:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#94a3b8; --grid:#e2e8f0;
      --blue:#2563eb; --blue-f:#eff6ff; --teal:#0e7490; --teal-f:#ecfeff;
      --violet:#7c3aed; --violet-f:#f5f3ff; --green:#15803d; --green-f:#f0fdf4;
      --amber:#b45309; --amber-f:#fffbeb; --red:#b91c1c; --red-f:#fef2f2;
      --slate:#475569; --slate-f:#f8fafc; }
    @media (prefers-color-scheme: dark){ :root{ --bg:#0d1117; --ink:#e6edf3; --muted:#8b949e;
      --line:#6e7681; --grid:#21262d;
      --blue:#58a6ff; --blue-f:#0d1d33; --teal:#39c5cf; --teal-f:#0b2226;
      --violet:#bc8cff; --violet-f:#1d1530; --green:#3fb950; --green-f:#0f2417;
      --amber:#d29922; --amber-f:#2a1f08; --red:#f85149; --red-f:#2d1214;
      --slate:#8b949e; --slate-f:#161b22; } }
    text{font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--ink)}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .bg{fill:var(--bg);stroke:var(--grid)}
    .ttl{font-size:20px;font-weight:700}
    .sub{font-size:13px;fill:var(--muted)}
    .lbl{font-size:14px;font-weight:600}
    .dt{font-size:12px}
    .sm{font-size:11px}
    .mut{fill:var(--muted)}
    .eb{font-size:11px;font-weight:600;letter-spacing:.06em}
    .big{font-size:20px;font-weight:700}
    .gl{stroke:var(--grid);stroke-width:1}
    .div{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4}
    .s-g{fill:var(--green)} .s-a{fill:var(--amber)} .s-s{fill:var(--slate)}
    .s-g,.s-a,.s-s{stroke:var(--bg);stroke-width:1.5}
    .v{fill:var(--bg);font-size:11px;font-weight:700}
    .c-green{fill:var(--green)} .c-amber{fill:var(--amber)} .c-slate{fill:var(--slate)} .c-violet{fill:var(--violet)}
    .tile{fill:var(--slate-f);stroke:var(--grid);stroke-width:1.5}
    .t-g{stroke:var(--green)} .t-v{stroke:var(--violet)} .t-a{stroke:var(--amber)} .t-s{stroke:var(--slate)}
    /* tiles glow one after another (8 s cycle) */
    .glow{animation:glow 8s ease-in-out infinite}
    @keyframes glow{0%,100%{stroke-width:1.5}10%{stroke-width:3}22%{stroke-width:1.5}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="0.5" style="stop-color:#ffffff;stop-opacity:0.45"/>
      <stop offset="1" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <clipPath id="bars">
      <rect x="96" y="152" width="480" height="28"/>
      <rect x="96" y="240" width="480" height="28"/>
      <rect x="96" y="280" width="480" height="28"/>
      <rect x="96" y="320" width="480" height="28"/>
      <rect x="96" y="360" width="480" height="28"/>
    </clipPath>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="959" height="519" rx="16"/>

  <!-- title -->
  <text class="ttl" x="32" y="44">Real-model evaluation: gpt-5.4-mini on 30 incident cases</text>
  <text class="sub" x="32" y="68">Azure OpenAI, five runs. Wrong labels never reach a runbook: the rules check sends them to a human.</text>

  <!-- legend -->
  <rect class="s-g" x="32" y="96" width="14" height="14" rx="3"/>
  <text class="dt" x="52" y="107">correct label → routed</text>
  <rect class="s-a" x="216" y="96" width="14" height="14" rx="3"/>
  <text class="dt" x="236" y="107">wrong label → human</text>
  <rect class="s-s" x="388" y="96" width="14" height="14" rx="3"/>
  <text class="dt" x="408" y="107">citation refused → human</text>

  <!-- grid + axis (0..30 maps to x 96..576, 16 px per case) -->
  <path class="gl" d="M96 148 V184 M256 148 V184 M416 148 V184 M576 148 V184 M96 236 V396 M256 236 V396 M416 236 V396 M576 236 V396"/>
  <text class="sm mut" x="96" y="414" text-anchor="middle">0</text>
  <text class="sm mut" x="256" y="414" text-anchor="middle">10</text>
  <text class="sm mut" x="416" y="414" text-anchor="middle">20</text>
  <text class="sm mut" x="576" y="414" text-anchor="middle">30</text>
  <text class="sm mut" x="336" y="434" text-anchor="middle">incident cases per run (30 each)</text>

  <!-- run 1: before guard fix -->
  <text class="eb c-slate" x="96" y="142">BEFORE GUARD FIX<tspan class="sm mut" style="letter-spacing:0;font-weight:400" dx="8">empty-list citations refused</tspan></text>
  <text class="lbl" x="32" y="171">Run 1</text>
  <rect class="s-g" x="96" y="152" width="208" height="28"/>
  <rect class="s-s" x="304" y="152" width="272" height="28"/>
  <text class="v" x="200" y="170" text-anchor="middle">13</text>
  <text class="v" x="440" y="170" text-anchor="middle">17</text>

  <path class="div" d="M32 208 H600"/>

  <!-- runs 2-5: current guard -->
  <text class="eb c-green" x="96" y="230">CURRENT GUARD<tspan class="sm mut" style="letter-spacing:0;font-weight:400" dx="8">runs 2–5</tspan></text>

  <text class="lbl" x="32" y="259">Run 2</text>
  <rect class="s-g" x="96" y="240" width="400" height="28"/>
  <rect class="s-s" x="496" y="240" width="80" height="28"/>
  <text class="v" x="296" y="258" text-anchor="middle">25</text>
  <text class="v" x="536" y="258" text-anchor="middle">5</text>

  <text class="lbl" x="32" y="299">Run 3</text>
  <rect class="s-g" x="96" y="280" width="400" height="28"/>
  <rect class="s-a" x="496" y="280" width="48" height="28"/>
  <rect class="s-s" x="544" y="280" width="32" height="28"/>
  <text class="v" x="296" y="298" text-anchor="middle">25</text>
  <text class="v" x="520" y="298" text-anchor="middle">3</text>
  <text class="v" x="560" y="298" text-anchor="middle">2</text>

  <text class="lbl" x="32" y="339">Run 4</text>
  <rect class="s-g" x="96" y="320" width="464" height="28"/>
  <rect class="s-a" x="560" y="320" width="16" height="28"/>
  <text class="v" x="328" y="338" text-anchor="middle">29</text>
  <text class="v" x="568" y="338" text-anchor="middle">1</text>

  <text class="lbl" x="32" y="379">Run 5</text>
  <rect class="s-g" x="96" y="360" width="432" height="28"/>
  <rect class="s-a" x="528" y="360" width="32" height="28"/>
  <rect class="s-s" x="560" y="360" width="16" height="28"/>
  <text class="v" x="312" y="378" text-anchor="middle">27</text>
  <text class="v" x="544" y="378" text-anchor="middle">2</text>
  <text class="v" x="568" y="378" text-anchor="middle">1</text>

  <!-- shimmer sweep over the finished bars (bars are complete without it) -->
  <g clip-path="url(#bars)">
    <rect x="-120" y="140" width="120" height="260" fill="url(#shine)">
      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
        values="96 0;696 0;696 0" keyTimes="0;0.6;1"/>
    </rect>
  </g>

  <!-- KPI tiles -->
  <rect class="tile t-g glow" x="640" y="96" width="288" height="84" rx="10"/>
  <text class="big c-green" x="656" y="130">26.5 / 30</text>
  <text class="dt" x="656" y="150">mean routed, runs 2–5</text>
  <text class="sm mut" x="656" y="166">range 25–29</text>

  <rect class="tile t-v glow" x="640" y="188" width="288" height="84" rx="10" style="animation-delay:2s"/>
  <text class="big c-violet" x="656" y="222">0</text>
  <text class="dt" x="656" y="242">forbidden tool executions</text>
  <text class="sm mut" x="656" y="258">all five runs</text>

  <rect class="tile t-a glow" x="640" y="280" width="288" height="84" rx="10" style="animation-delay:4s"/>
  <text class="big c-amber" x="656" y="314">6 / 120</text>
  <text class="dt" x="656" y="334">wrong labels / case-runs, runs 2–5</text>
  <text class="sm mut" x="656" y="350">all escalated to a human</text>

  <rect class="tile t-s glow" x="640" y="372" width="288" height="84" rx="10" style="animation-delay:6s"/>
  <text class="big" x="656" y="406">≈ $0.18 <tspan class="dt mut" style="font-weight:400">per run</tspan></text>
  <text class="dt" x="656" y="426">$0.92 total</text>
  <text class="sm mut" x="656" y="442">five runs and three probes, Azure</text>

  <!-- caption -->
  <text class="sm mut" x="32" y="488">One model, 30 cases written with the rules classifier, five runs: describes this setup, not model quality in general. Claude not yet evaluated.</text>
</svg>
