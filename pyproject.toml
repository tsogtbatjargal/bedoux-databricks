[project]
name = "bedoux-databricks"
version = "0.1.0"
description = "Portfolio lakehouse and Bedoux Sentinel development environment"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
agents = [
    "anthropic>=2.8.0",
    "openai>=2",
]
dev = [
    "duckdb>=2.0.0",
    "pytest>=8,<9",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
]

[tool.uv]
# Databricks loads pipeline files directly; this repository is not a wheel.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
