name: CI

on:
  # Pull requests are never filtered: every proposed change gets the full
  # test + validate signal, including documentation-only ones.
  pull_request:
    branches: [main]
  # A push to main can deploy, so it is filtered. Documentation and agent
  # configuration cannot change the bundle, so those pushes skip this workflow
  # entirely rather than deploying. A push touching anything else still runs
  # the full pipeline. paths-ignore skips only when *every* changed file
  # matches, so a commit mixing docs with pipeline code still deploys.
  push:
    branches: [main]
    paths-ignore:
      # "**.md", not "**/*.md": the latter needs a literal slash and would miss
      # root-level files such as README.md, AGENTS.md, and CLAUDE.md.
      - "**.md"
      - "docs/**"
      - ".agents/**"
      - ".claude/**"
      - ".codex/**"
      - ".gitignore"
      - "LICENSE"
  # Manual deployment is opt-in. Dispatching with deploy unchecked runs the
  # checks only; it no longer touches the workspace as a side effect.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy the bundle to the dev target"
        type: boolean
        default: false
      run_job:
        description: "Also run bedoux_analytics_job after deploying (requires deploy)"
        type: boolean
        default: false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v

  validate:
    name: Validate bundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle validate --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy:
    name: Deploy bundle
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      - name: Run bedoux_analytics_job (manual opt-in only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_job == true
        run: databricks bundle run bedoux_analytics_job --target dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
